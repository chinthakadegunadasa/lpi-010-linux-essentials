name: Compile B5 Auto-Hyphenated PDFs & Deploy to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # STAGE 1: Parallel Matrix B5 PDF Generation via OnlyOffice
  # ------------------------------------------------------------------
  build-b5-pdfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - src: "Chapter1.md"
            out: "Chapter_1_Introduction_to_Enterprise_Linux.pdf"
          - src: "Chapter2.md"
            out: "Chapter_2_Navigating_the_Linux_File_System.pdf"
          - src: "Chapter3.md"
            out: "Chapter_3_The_Power_of_the_Command_Line.pdf"
          - src: "Chapter4.md"
            out: "Chapter_4_The_Linux_Operating_System_Architecture.pdf"
          - src: "Chapter5.md"
            out: "Chapter_5_Security_and_File_Permissions.pdf"
          - src: "Chapter6.md"
            out: "Chapter_6_Software_Package_Management.pdf"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc, OnlyOffice Desktop Editors & Hyphenation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            unzip \
            zip \
            liberation-fonts \
            hyphen-en-us

          # Install OnlyOffice Desktop Editors for Headless B5 Auto-Hyphenated Rendering
          echo "deb https://download.onlyoffice.com/repo/debian squeeze main" | sudo tee /etc/apt/sources.list.d/onlyoffice.list
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys CB2DE8E5
          sudo apt-get update
          sudo apt-get install -y onlyoffice-desktopeditors

      - name: Convert to B5 ODT & Enable Auto-Hyphenation
        run: |
          SRC="${{ matrix.src }}"
          OUT="${{ matrix.out }}"
          
          if [ -f "$SRC" ]; then
            echo "Building B5 layout for $SRC..."
            
            # 1. Convert Markdown to ODT with strict B5 page geometry and 20mm margins
            pandoc "$SRC" -o temp.odt \
              --variable=geometry:paperb5paper \
              --variable=geometry:margin=20mm
            
            # 2. Inject OpenDocument auto-hyphenation properties into XML manifest
            mkdir odt_tmp
            unzip -q temp.odt -d odt_tmp
            sed -i 's/<style:paragraph-properties/<style:paragraph-properties fo:hyphenate="true" fo:hyphenation-remain-char-count="2" fo:hyphenation-push-char-count="2"/g' odt_tmp/styles.xml
            sed -i 's/<style:paragraph-properties/<style:paragraph-properties fo:hyphenate="true" fo:hyphenation-remain-char-count="2" fo:hyphenation-push-char-count="2"/g' odt_tmp/content.xml
            (cd odt_tmp && zip -q -r ../b5_hyphenated.odt *)
            
            # 3. Headless conversion to PDF using OnlyOffice Desktop Editors engine
            desktopeditors --headless --all-formats-to=pdf b5_hyphenated.odt
            mv b5_hyphenated.pdf "$OUT"
          else
            echo "Error: Source file $SRC not found!" && exit 1
          fi

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          retention-days: 1

  # ------------------------------------------------------------------
  # STAGE 2: Validate Python Simulator
  # ------------------------------------------------------------------
  validate-simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Syntax
        run: |
          if [ -f "exam_simulator.py" ]; then
            python3 -m py_compile exam_simulator.py
          fi

  # ------------------------------------------------------------------
  # STAGE 3: Deploy to GitHub Pages
  # ------------------------------------------------------------------
  deploy-pages:
    needs: [build-b5-pdfs, validate-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Staging Directory
        run: mkdir -p _site

      - name: Download All PDF Artifacts
        uses: actions/download-artifact@v4
        with:
          path: _site
          merge-multiple: true

      - name: Bundle Exam Simulator Script
        run: |
          if [ -f "exam_simulator.py" ]; then
            cp exam_simulator.py _site/
            chmod +x _site/exam_simulator.py
          fi

      - name: Generate Index Page
        run: |
          cd _site
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Enterprise Linux B5 Training Manuals</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292e; }
                  h1, h2 { border-bottom: 1px solid #e1e4e8; padding-bottom: 10px; }
                  ul { list-style-type: none; padding: 0; }
                  li { margin: 10px 0; background: #f6f8fa; padding: 12px 16px; border-radius: 6px; border: 1px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; }
                  a { color: #0366d6; text-decoration: none; font-weight: 600; }
                  a:hover { text-decoration: underline; }
                  .badge { background-color: #2ea44f; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
              </style>
          </head>
          <body>
              <h1>Enterprise Linux B5 Publishing Portal</h1>
              <h2>📘 B5 Auto-Hyphenated Handbooks (OnlyOffice Engine)</h2>
              <ul>
          EOF

          for pdf in *.pdf; do
              if [ -f "$pdf" ]; then
                  echo "        <li><span>📄 <strong>$pdf</strong> <span class=\"badge\">B5 Format</span></span> <a href=\"$pdf\" target=\"_blank\">Download PDF</a></li>" >> index.html
              fi
          done

          cat << 'EOF' >> index.html
              </ul>
              <h2>🧪 Terminal Hands-On Exam Simulator</h2>
              <p><a href="exam_simulator.py" download>Download exam_simulator.py</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
